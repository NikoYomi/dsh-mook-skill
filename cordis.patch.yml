# dsh-mook-skill bundle patch
#
# 本文件是发布用（`dsh plugin --profile web add @yoursc/dsh-mook-skill`）的
# `dsh.bundle.patch` 层：装上包并把它加进 profile 的 `dsh.profile.bundles` 后，
# profile 启动会合并这份 patch，激活插件。
#
# 1.0.0 起，这一行挂载就够用了 —— 插件自己在宿主进程里提供：
#   · 14 个 mook_* 工具（ctx.tools.register）
#   · mook 技能（ctx.skills.register，读包内 skills/mook/SKILL.md）
#   · 设置页与 /mook/api/* 路由
# 不再需要单独的 MCP server 实例，也不需要在 profile 的 cordis.patch.yml 里
# 填地址和密钥（密钥进宿主凭据库，在设置页里管理）。
- insert:
    - id: mook
      name: '@yoursc/dsh-mook-skill'
