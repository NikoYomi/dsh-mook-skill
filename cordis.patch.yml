# dsh-mook-skill bundle patch
#
# 本文件是发布用（`dsh plugin add @yoursc/dsh-mook-skill`）的 `dsh.bundle.patch`
# 层：装上包并把它加进 profile 的 `dsh.profile.bundles` 后，profile 启动会合并
# 这份 patch，从而激活宿主半场插件（设置页路由 /mook/api/*）。
#
# 注意：这里**不**顺手挂 MCP server。MCP 是独立实例（`@deepseek-ai/dsh-mcp-client`），
# 需要填密钥，交给设置页「MCP 配置」卡片生成片段后再粘进你 profile 的
# cordis.patch.yml，避免把密钥写进这个随包发布的文件里。
- insert:
    - id: mook
      name: '@yoursc/dsh-mook-skill'
